[project]
name = "revit-mcp"
version = "0.9.0"
description = "MCP server for Autodesk Revit via pyRevit Routes, with a one-command installer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # >=2: uses mcp.server.mcpserver (MCPServer); 1.x's mcp.server.fastmcp is gone
    "mcp[cli]>=2.0.0,<3",
    "httpx>=0.27",
    # SQL Server mirror (push-sql). Windows wheels exist for all supported
    # Pythons; imported lazily so everything else works without a driver.
    "pyodbc>=5",
]

[project.scripts]
revit-mcp = "revit_mcp_server.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling ships every file under the package dir, so the pyRevit extension
# payload under src/revit_mcp_server/extension/ rides along as package data.
[tool.hatch.build.targets.wheel]
packages = ["src/revit_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests drive a LIVE Revit — including opening and closing
# documents. They must never run implicitly (a plain `pytest` while someone
# has a model open would close it): opt in with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: tests that require a running Revit instance (slow)",
]
